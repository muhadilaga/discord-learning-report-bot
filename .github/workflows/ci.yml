name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: |
          python -m py_compile bot.py authorize_google.py

      - name: Import smoke test
        env:
          DISCORD_BOT_TOKEN: dummy-token-for-ci
        run: |
          python - <<'PY'
          import os
          os.environ['DISCORD_BOT_TOKEN'] = os.environ.get('DISCORD_BOT_TOKEN', 'dummy-token-for-ci')
          import bot
          print('bot import ok')
          PY
